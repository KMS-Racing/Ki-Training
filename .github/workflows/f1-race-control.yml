name: F1 Race Control

# Zwei Läufe, weil sie unterschiedliche Dinge beweisen:
#
#   Linux  — baut die Engine und lässt alle Tests laufen. Das ist die Rennlogik.
#   macOS  — prüft zusätzlich die SwiftUI-App gegen das echte SDK. Genau das
#            geht auf Linux nicht, weil es dort kein SwiftUI gibt.
#
# Der macOS-Lauf ist der Grund für diese Datei: Ohne ihn bliebe die App
# ungeprüft, bis jemand sie von Hand in Xcode öffnet.

on:
  push:
    paths:
      - 'f1-race-control/**'
      - '.github/workflows/f1-race-control.yml'
  pull_request:
    paths:
      - 'f1-race-control/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: f1-race-control

jobs:
  engine:
    name: Engine und Tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Bauen
        run: swift build
      - name: Tests
        run: swift test
      - name: Ein Rennen wirklich durchfahren
        run: swift run f1ctl --circuit monza --laps 10 --seed 42 --headless --no-color
      - name: Eine Saison anrechnen
        run: |
          swift run f1ctl season new --seed 2026 --length 0.1
          swift run f1ctl season simulate 3 --no-color
          swift run f1ctl season standings --no-color

  app:
    name: SwiftUI-App (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Baut alles, was das Paket auf dem Mac hergibt — und das schließt seit
      # neuestem die SwiftUI-App mit ein. Sie ist dort ein eigenes Ziel, unter
      # Linux gibt es sie nicht (siehe Package.swift).
      - name: Paket bauen (samt App)
        run: swift build

      # Der Bau oben übersetzt und bindet die App bereits. Dieser Schritt prüft
      # ausdrücklich noch einmal nur die App-Quellen — damit im Protokoll steht,
      # ob ein Fehler aus der Engine oder aus der Oberfläche kam.
      - name: SwiftUI-Quellen typprüfen
        run: |
          BIN=$(swift build --show-bin-path)
          echo "Module aus: $BIN"
          xcrun swiftc -typecheck \
            -sdk "$(xcrun --show-sdk-path --sdk macosx)" \
            -target arm64-apple-macos14.0 \
            -swift-version 5 \
            -I "$BIN" -I "$BIN/Modules" \
            App/*.swift App/Views/*.swift

      # Das Programm muss auch wirklich entstanden sein. Ob das Fenster gut aussieht,
      # kann dieser Lauf nicht sagen — der Rechner hat keinen Bildschirm.
      - name: App-Programm vorhanden
        run: |
          BIN=$(swift build --show-bin-path)
          ls -lh "$BIN/F1RaceControl"
          file "$BIN/F1RaceControl"

      # Der eigentliche Grund für diesen Lauf: Das Xcode-Projekt ist erzeugt
      # (Tools/gen_xcodeproj.py), nicht in Xcode geklickt. Ob Xcode es überhaupt
      # öffnen und bauen kann, sagt nur Xcode selbst.
      - name: Xcode-Projekt bauen (Mac)
        run: |
          xcodebuild -version
          xcodebuild \
            -project Xcode/F1RaceControl.xcodeproj \
            -scheme F1RaceControl \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Und dasselbe fürs iPad — das ist die zweite Zielplattform aus dem README.
      - name: Xcode-Projekt bauen (iPad-Simulator)
        run: |
          xcodebuild \
            -project Xcode/F1RaceControl.xcodeproj \
            -scheme F1RaceControl \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-ios" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Tests auch auf macOS
        run: swift test
